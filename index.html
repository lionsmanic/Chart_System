function setSecStatus(state,msg){
  const icons={ready:'🟡',loading:'⏳',done:'✅',error:'❌'};
  const el=document.getElementById('sec-status');
  if(!el) return;
  el.style.display='flex';
  document.getElementById('sec-status-icon').textContent=icons[state]||'⏳';
  document.getElementById('sec-status-msg').textContent=msg;
  el.style.background=state==='done'?'#EEF7F4':state==='error'?'#FAF0EE':'var(--card)';
}

async function runSecAIScan(){
  // 判斷來源：暫存區 or 重新上傳
  const binPicker=document.getElementById('sec-bin-picker');
  const binMode=binPicker&&binPicker.style.display!=='none';
  let imgs;
  if(binMode){
    const selected=document.querySelectorAll('.bin-pick-thumb.selected');
    if(!selected.length){ toast('請先點選暫存區的檔案'); return; }
    imgs=[...selected].map(el=>photoBin[parseInt(el.dataset.idx)]).filter(Boolean);
  } else {
    imgs=secScanImages.filter(Boolean);
    if(!imgs.length){ toast('請先選擇圖片'); return; }
  }
  const apiKey=document.getElementById('sec-gemini-key')?.value.trim()||getGeminiKey();
  if(!apiKey){ toast('請先輸入 Gemini API Key'); return; }

  const btn=document.getElementById('sec-scan-btn');
  btn.disabled=true; btn.textContent=`⏳ 辨識中（${imgs.length} 個檔案）…`;
  setSecStatus('loading',`Gemini 正在分析 ${imgs.length} 個檔案，請稍候…`);

  const fieldList=secScanFields.map(f=>`- ${f.label}（類型：${f.type}${f.options?'，選項：'+f.options:''}）`).join('\n');

  try{
    const parts=filesToGeminiParts(imgs);
    parts.push({text:`你是醫療資料萃取助理。請從以上 ${imgs.length} 個附件（可能包含圖片、PDF、Word、Excel、文字檔）中，綜合所有內容，找出與下列欄位對應的資訊：\n\n${fieldList}\n\n請只回覆 JSON，key 為欄位名稱，value 為找到的資訊。沒找到的欄位不要包含。日期用 YYYY-MM-DD。select 類型只回覆選項中完全相符的值。不要 markdown。`});

    const resp=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}]})}
    );
    if(!resp.ok){ const err=await resp.json(); throw new Error(err.error?.message||`HTTP ${resp.status}`); }
    const data=await resp.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'{}';
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());

    secScanResult={};
    const resultItems=[];
    for(const f of secScanFields){
      const val=parsed[f.label];
      if(val!==undefined&&val!==null&&val!==''){
        secScanResult[f.id]=String(val);
        const cur=formData[f.id];
        const curStr = cur===undefined||cur===null ? '' : String(cur);
        resultItems.push({field:f,value:String(val),currentVal:curStr});
      }
    }

    if(!resultItems.length){
      setSecStatus('error','找不到對應此區欄位的資料，請確認照片內容或清晰度');
      btn.disabled=false; btn.textContent='🤖 重新辨識';
      return;
    }

    const overwriteCount=resultItems.filter(it=>it.currentVal&&it.currentVal!==it.value).length;

    document.getElementById('sec-result-list').innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--cream);border-bottom:1px solid var(--border2)">
        <span style="font-size:12px;font-weight:700;color:var(--muted)">勾選要套用的欄位${overwriteCount?`　<span style="color:var(--red)">（${overwriteCount} 個已有資料）</span>`:''}</span>
        <div style="display:flex;gap:10px">
          <button onclick="toggleAllSecAI(true)" style="font-size:11px;font-weight:700;color:var(--sage);background:none;border:none;cursor:pointer;padding:2px 0">全選</button>
          <button onclick="toggleAllSecAI(false)" style="font-size:11px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 0">全不選</button>
        </div>
      </div>
      ${resultItems.map(({field,value,currentVal})=>{
        const willOverwrite=currentVal&&currentVal!==value;
        const curDisplay=currentVal.replace(/\|/g,'、');
        const newDisplay=value.replace(/\|/g,'、');
        return `
        <label style="display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;${willOverwrite?'background:#FEF9F0':''}"
          onmouseenter="this.style.background='${willOverwrite?'#FDF2E0':'var(--sage-light)'}'" onmouseleave="this.style.background='${willOverwrite?'#FEF9F0':''}'">
          <input type="checkbox" class="sec-ai-check" data-fid="${field.id}" ${willOverwrite?'':'checked'}
            style="width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:${willOverwrite?'var(--red)':'var(--sage)'};cursor:pointer">
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:4px">${escH(field.label)}</div>
            ${willOverwrite?`
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                <span style="font-size:10px;font-weight:700;color:#fff;background:var(--red);padding:1px 7px;border-radius:9px;flex-shrink:0">原有資料</span>
                <span style="font-size:13px;color:var(--muted);text-decoration:line-through;word-break:break-all">${escH(curDisplay)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-size:10px;font-weight:700;color:#fff;background:var(--sage);padding:1px 7px;border-radius:9px;flex-shrink:0">AI 讀取</span>
                <span style="font-size:14px;color:var(--ink);font-weight:700;word-break:break-all">${escH(newDisplay)}</span>
              </div>
              <div style="font-size:11px;color:var(--red);margin-top:5px;font-weight:600">⚠️ 此欄位已有資料，預設不勾選。確認 AI 讀的正確再打勾覆蓋</div>
            `:`
              <div style="font-size:14px;color:var(--ink);font-weight:600;word-break:break-all;line-height:1.5">${escH(newDisplay)}</div>
            `}
          </div>
        </label>`;
      }).join('')}`;
    document.getElementById('sec-result').style.display='';
    document.getElementById('sec-apply-btn').style.display='flex';
    setSecStatus('done',`找到 ${resultItems.length} 個欄位${overwriteCount?`（${overwriteCount} 個已有資料，請確認）`:''}，勾選後套用`);

  } catch(err){
    setSecStatus('error','辨識失敗：'+err.message);
  }
  btn.disabled=false; btn.textContent='🤖 重新辨識';
}

function toggleAllSecAI(checked){
  document.querySelectorAll('#sec-result-list .sec-ai-check').forEach(cb=>cb.checked=checked);
}

function applySecAIResult(){
  const checks=document.querySelectorAll('#sec-result-list .sec-ai-check:checked');
  if(!checks.length){toast('請至少勾選一個欄位');return;}
  let count=0;
  checks.forEach(cb=>{
    const fid=cb.dataset.fid;
    const val=secScanResult[fid];
    if(val===undefined) return;
    applyFieldValue(fid,val);
    count++;
  });
  dirty=true;
  document.getElementById('savebar').classList.add('on');
  closeSecAI();
  toast(`✅ 已套用 ${count} 個欄位，請確認後儲存`);
}
let aiImages = [];      // [{base64, mimeType, dataUrl}]
let aiParsedResult = {};

// 載入已存的 Gemini Key
function loadGeminiKey(){
  const k = localStorage.getItem('geminiApiKey')||'';
  const el = document.getElementById('gemini-key');
  if(el && k) el.value = k;
}
function saveGeminiKey(){
  const k = document.getElementById('gemini-key')?.value.trim();
  if(!k){ alert('請先輸入 API Key'); return; }
  localStorage.setItem('geminiApiKey', k);
  toast('✅ API Key 已記住（存在本機）');
}
function getGeminiKey(){
  return document.getElementById('gemini-key')?.value.trim() || localStorage.getItem('geminiApiKey')||'';
}

function handleAIFiles(input){

async function processAIFiles(files){
  aiImages=[];
  const MAX=8;
  const toLoad=files.slice(0,MAX);
  const errors=[];
  for(const file of toLoad){
    try{
      const item=await readFileForAI(file);
      aiImages.push(item);
    }catch(err){ errors.push(err.message); }
  }
  if(errors.length) toast('⚠️ '+errors[0], 4000);
  if(aiImages.length) renderThumbs();
}

function renderThumbs(){
  const grid=document.getElementById('ai-thumbs-grid');
  grid.innerHTML=aiImages.filter(Boolean).map((img,i)=>{
    const kind=img.kind||'image';
    const isHeic=isHeicName(img.name);
    let inner;
    if(kind==='image' && img.dataUrl && !isHeic){
      inner=`<img src="${img.dataUrl}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid var(--border)">`;
    } else if(kind==='pdf'){
      inner=`<div style="width:80px;height:80px;border-radius:8px;border:2px solid var(--red-border);background:#FDF0EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <span style="font-size:24px">📕</span><span style="font-size:9px;color:var(--red);font-weight:700">PDF</span></div>`;
    } else if(kind==='text'){
      inner=`<div style="width:80px;height:80px;border-radius:8px;border:2px solid #C5E0D8;background:#EEF7F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <span style="font-size:22px">${img.isExcel?'📊':'📄'}</span><span style="font-size:9px;color:var(--sage);font-weight:700">${img.isExcel?'Excel':(img.text||'').length+' 字'}</span></div>`;
    } else {
      inner=`<div style="width:80px;height:80px;border-radius:8px;border:2px solid var(--border);background:var(--cream);display:flex;align-items:center;justify-content:center"><span style="font-size:22px;opacity:.4">🖼️</span></div>`;
    }
    return `
    <div style="position:relative;width:80px;flex-shrink:0" title="${escH(img.name||'')}">
      ${inner}
      <button onclick="removeAIImg(${i})" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">✕</button>
      <div style="font-size:9px;color:var(--muted);text-align:center;margin-top:3px;word-break:break-all;line-height:1.3;max-height:24px;overflow:hidden">${escH((img.name||'').slice(0,14))}</div>

  }).join('');

  document.getElementById('ai-upload-area').style.display='none';
  document.getElementById('ai-thumbs').style.display='';

  setAIStatus('ready','準備就緒，按下「開始 Gemini 辨識」');
}

function removeAIImg(i){
  aiImages.splice(i,1);
  if(!aiImages.length){resetAIScan();return;}
  renderThumbs();
}

function setAIStatus(state,msg){
  const icons={ready:'🟡',loading:'⏳',done:'✅',error:'❌'};
  const el=document.getElementById('ai-status');
  if(!el)return;
  document.getElementById('ai-status-icon').textContent=icons[state]||'⏳';

async function startAIScan(){
  const imgs=aiImages.filter(Boolean);
  if(!imgs.length){toast('請先選擇檔案');return;}
  const apiKey=getGeminiKey();
  if(!apiKey){toast('請先輸入 Gemini API Key');return;}

  const p=await dbGet('projects',PID);
  const fields=p.fields||DEFAULT_FIELDS;
  const fieldList=fields.map(f=>`- ${f.label}（類型：${f.type}${f.options?'，選項：'+f.options:''}）`).join('\n');

  const btn=document.getElementById('ai-scan-btn');
  btn.disabled=true;btn.textContent=`🤖 辨識中（${imgs.length} 個檔案）...`;
  setAIStatus('loading',`Gemini 正在分析 ${imgs.length} 個病歷檔案，請稍候...`);

  try{
    // 組合圖片 / PDF / 文字檔的 parts
    const parts=filesToGeminiParts(imgs);
    parts.push({text:`
你是一個醫療資料萃取助理。請仔細閱讀以上 ${imgs.length} 個病歷附件（可能包含圖片、PDF、Word、Excel、文字檔），綜合所有內容，從中萃取資訊並對應到以下問卷欄位。

問卷欄位清單：
${fieldList}

請以 JSON 格式回覆，key 為欄位名稱，value 為從附件中找到的對應內容。
規則：
- 如果多個附件有同一欄位的資料，以最完整或最新的為準
- 如果沒有找到某欄位，請不要包含該 key
- 日期請用 YYYY-MM-DD 格式
- select 類型請只回覆選項中完全相符的其中一個
- 只回覆 JSON，不要其他說明文字、不要 markdown`});

    const resp=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts}]})
      }
    );
    if(!resp.ok){
      const err=await resp.json();
      throw new Error(err.error?.message||`HTTP ${resp.status}`);
    }
    const data=await resp.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'{}';
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);

    aiParsedResult={};
    const resultItems=[];
    for(const f of fields){
      const val=parsed[f.label];
      if(val!==undefined&&val!==null&&val!==''){
        aiParsedResult[f.id]=String(val);
        const cur=formData[f.id];
        const curStr = cur===undefined||cur===null ? '' : String(cur);
        resultItems.push({field:f,value:String(val),currentVal:curStr});
      }
    }

    if(!resultItems.length){
      setAIStatus('error','Gemini 未能從圖片中辨識出對應欄位，請確認圖片清晰度或欄位名稱');
      btn.disabled=false;btn.textContent='🤖 開始 Gemini 辨識';
      return;
    }

    const overwriteCount=resultItems.filter(it=>it.currentVal&&it.currentVal!==it.value).length;

    document.getElementById('ai-result-list').innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--cream);border-bottom:1px solid var(--border2)">
        <span style="font-size:12px;font-weight:700;color:var(--muted)">勾選要套用的欄位${overwriteCount?`　<span style="color:var(--red)">（${overwriteCount} 個已有資料）</span>`:''}</span>
        <div style="display:flex;gap:10px">
          <button onclick="toggleAllAI(true)" style="font-size:11px;font-weight:700;color:var(--sage);background:none;border:none;cursor:pointer;padding:2px 0">全選</button>
          <button onclick="toggleAllAI(false)" style="font-size:11px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 0">全不選</button>
        </div>
      </div>
      ${resultItems.map(({field,value,currentVal})=>{
        const willOverwrite=currentVal&&currentVal!==value;
        const curDisplay=currentVal.replace(/\|/g,'、');
        const newDisplay=value.replace(/\|/g,'、');
        return `
        <label style="display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid #f0f6fc;cursor:pointer;transition:background .12s;${willOverwrite?'background:#FEF9F0':''}"
          onmouseenter="this.style.background='${willOverwrite?'#FDF2E0':'var(--sage-light)'}'" onmouseleave="this.style.background='${willOverwrite?'#FEF9F0':''}'">
          <input type="checkbox" class="ai-check" data-fid="${field.id}" ${willOverwrite?'':'checked'}
            style="width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:${willOverwrite?'var(--red)':'var(--sage)'};cursor:pointer">
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:4px">${escH(field.label)}</div>
            ${willOverwrite?`
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                <span style="font-size:10px;font-weight:700;color:#fff;background:var(--red);padding:1px 7px;border-radius:9px;flex-shrink:0">原有資料</span>
                <span style="font-size:13px;color:var(--muted);text-decoration:line-through;word-break:break-all">${escH(curDisplay)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-size:10px;font-weight:700;color:#fff;background:var(--sage);padding:1px 7px;border-radius:9px;flex-shrink:0">AI 讀取</span>
                <span style="font-size:14px;color:var(--ink);font-weight:700;word-break:break-all">${escH(newDisplay)}</span>
              </div>
              <div style="font-size:11px;color:var(--red);margin-top:5px;font-weight:600">⚠️ 此欄位已有資料，預設不勾選。確認 AI 讀的正確再打勾覆蓋</div>
            `:`
              <div style="font-size:14px;color:var(--ink);font-weight:600;word-break:break-all;line-height:1.5">${escH(newDisplay)}</div>
            `}
          </div>
        </label>`;
      }).join('')}`;
    document.getElementById('ai-result').style.display='';
    setAIStatus('done',`辨識完成！找到 ${resultItems.length} 個欄位${overwriteCount?`（${overwriteCount} 個已有資料，請確認）`:''}，勾選後套用`);

  } catch(err){
    setAIStatus('error','辨識失敗：'+err.message);
    console.error(err);
  }
  btn.disabled=false;btn.textContent='🤖 開始 Gemini 辨識';
}

function toggleAllAI(checked){
  document.querySelectorAll('#ai-result-list .ai-check').forEach(cb=>cb.checked=checked);
}

function applyAIResult(){
  const checks=document.querySelectorAll('#ai-result-list .ai-check:checked');
  if(!checks.length){toast('請至少勾選一個欄位');return;}
  let count=0;
  checks.forEach(cb=>{
    const fid=cb.dataset.fid;
    const val=aiParsedResult[fid];
    if(val===undefined) return;
    applyFieldValue(fid,val);

  });

}

// ── 批次：將所有病例的補充備註設為連動模式 ────────────────────────────
async function resetAllPhotoNotesToLink(pid){
  const cases=await dbIdx('cases','pid',pid);
  if(!cases.length){
    toast('此 Project 尚無病例');
    return;
  }
  // 統計現況
  let customCount=0, linkedCount=0;
  cases.forEach(c=>{
    const flag=c.data?.['__photoNoteCustom'];
    const val=c.data?.['__photoNote'];
    if(flag===true) customCount++;
    else if(val!==undefined && val!=='') customCount++; // 舊資料也視為自訂
    else linkedCount++;
  });

  const msg=`即將處理 ${cases.length} 筆病例：

✍️ 已自訂備註的：${customCount} 筆 → 自訂內容會被清除
🔗 已連動 / 空白的：${linkedCount} 筆 → 不變

完成後，所有病例的補充備註都會「即時連動」最新預設文字。

確定執行？此動作無法復原（建議先匯出 JSON 備份）。`;

  if(!confirm(msg)) return;

  let updated=0;
  for(const c of cases){
    const had = c.data['__photoNote']!==undefined || c.data['__photoNoteCustom']!==undefined;
    if(had){
      delete c.data['__photoNote'];
      delete c.data['__photoNoteCustom'];
      c.updatedAt=Date.now();
      await dbPut('cases',c);
      updated++;
    }
  }
  toast(`✅ 完成！${updated} 筆病例已設為連動模式`);
}

function toggleAllAppDef(checked){
  document.querySelectorAll('.app-def-cb').forEach(cb=>cb.checked=checked);
}
function commitApplyDefCase(){
  const checks=document.querySelectorAll('.app-def-cb:checked');
  if(!checks.length){toast('請至少勾選一個欄位');return;}
  let count=0;
  checks.forEach(async cb=>{
    const fid=cb.dataset.fid;
    const p=await dbGet('projects',PID);
    const f=(p.fields||DEFAULT_FIELDS).find(x=>x.id===fid);
    if(!f) return;
    // 只在目前仍是空白時才填入
    const cur=formData[fid];
    if(cur===undefined||cur===null||cur===''){
      applyFieldValue(fid,f.defaultValue);
      count++;
    }
  });
  // 觸發 dirty
  dirty=true;
  document.getElementById('savebar').classList.add('on');
  document.getElementById('apply-def-modal').remove();
  setTimeout(()=>toast(`✅ 已套用預設值到空白欄位，請確認後儲存`),50);
}

function toggleAllAppDefAll(checked){
  document.querySelectorAll('.app-def-all-cb').forEach(cb=>cb.checked=checked);
}
async function commitApplyDefAll(pid){
  const checks=[...document.querySelectorAll('.app-def-all-cb:checked')];
  if(!checks.length){toast('請至少勾選一個欄位');return;}
  const p=await dbGet('projects',pid);
  const allFields=p.fields||DEFAULT_FIELDS;
  const cases=await dbIdx('cases','pid',pid);

  let totalFilled=0;
  for(const c of cases){
    let changed=false;
    for(const cb of checks){
      const fid=cb.dataset.fid;
      const f=allFields.find(x=>x.id===fid);
      if(!f||!f.defaultValue) continue;
      const cur=c.data?.[fid];
      if(cur===undefined||cur===null||cur===''){
        c.data[fid]=f.defaultValue;
        changed=true;
        totalFilled++;
      }
    }
    if(changed){
      c.updatedAt=Date.now();
      await dbPut('cases',c);
    }
  }

  document.getElementById('apply-def-all-modal').remove();
  toast(`✅ 已填入 ${totalFilled} 個空白儲存格`);
  // 重新渲染
  const newCases=await dbIdx('cases','pid',pid);
  const orderedFields=getOrderedFields(p.fields||DEFAULT_FIELDS);
  rerenderSummaryTable(newCases,orderedFields,p);
}
function discardChanges(){
  if(!confirm('確定放棄所有變更？'))return;
  formData={...formOrig};dirty=false;
  document.getElementById('savebar').classList.remove('on');
  vCase();
}
async function delCase(cid){
  if(!confirm('確定刪除此病例？此動作無法復原。'))return;
  await dbDel('cases',cid);dirty=false;toast('🗑️ 已刪除');goProject(PID);
}

// 依欄位型別給出可選值（select/multiselect 給選項；其他給空字串讓使用者自填）
function valuesForField(fid){
  const f=editFields.find(x=>x.id===fid);
  if(!f) return [];
  if(['select','multiselect'].includes(f.type)){
    return (f.options||'').split(',').map(s=>s.trim()).filter(Boolean);
  }
  return [];
}

// ── 分區拖曳排序 ──────────────────────────────────────────────────────────
let secDragSrc=null;

function onSecDragStart(e,el){
  // 若是欄位內的拖曳觸發則忽略分區拖曳
  if(e.target.closest('.fi')){ e.stopPropagation(); return; }
  secDragSrc=el.dataset.section;
  el.style.opacity='.45';
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain','sec:'+secDragSrc);
}

function onSecDragOver(e,el){
  if(!secDragSrc) return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect='move';
  // 移除其他分區的指示線
  document.querySelectorAll('.sec-group').forEach(g=>{
    g.style.boxShadow=''; g.style.borderTop='';
  });
  const targetSec=el.dataset.section;
  if(targetSec && targetSec!==secDragSrc){
    el.style.boxShadow='0 -3px 0 var(--sage)';
  }
}

function onSecDrop(e,el){
  e.preventDefault(); e.stopPropagation();
  const toSec=el.dataset.section;
  if(!secDragSrc||!toSec||secDragSrc===toSec){ onSecDragEnd(e,el); return; }

  // 取得目前分區順序
  const sections=[];
  const seen=new Set();
  editFields.forEach(f=>{if(!seen.has(f.section)){sections.push(f.section);seen.add(f.section);}});

  const fromIdx=sections.indexOf(secDragSrc);
  const toIdx=sections.indexOf(toSec);
  if(fromIdx<0||toIdx<0){ onSecDragEnd(e,el); return; }

  // 把 secDragSrc 的所有欄位提取出來
  const movedFields=editFields.filter(f=>f.section===secDragSrc);
  const rest=editFields.filter(f=>f.section!==secDragSrc);

  // 在 rest 中找到 toSec 最後一個欄位的 index，插在其後
  // 若 toIdx < fromIdx，插在 toSec 第一個欄位之前
  const insertBefore = toIdx < fromIdx;
  const targetIdx = insertBefore
    ? rest.findIndex(f=>f.section===toSec)
    : rest.reduce((acc,f,i)=>f.section===toSec?i:acc, -1)+1;

  rest.splice(targetIdx, 0, ...movedFields);
  editFields.length=0;
  rest.forEach(f=>editFields.push(f));

  onSecDragEnd(e,el);
  document.getElementById('flist-wrap').innerHTML=renderFieldsBySection();
  initDragDrop();
  toast(`分區「${secDragSrc}」已移動`);
}

function onSecDragEnd(e,el){
  document.querySelectorAll('.sec-group').forEach(g=>{
    g.style.opacity='';g.style.boxShadow='';
    g.setAttribute('draggable','false');
  });
  secDragSrc=null;
}

function commitQAdd(sectionName, color){
  const label = document.getElementById('qa-label').value.trim();
  if(!label){ alert('請輸入欄位名稱'); return; }
  const type = document.querySelector('#qa-tchips .tchip.sel')?.dataset.t || 'text';
  const options = document.getElementById('qa-options')?.value.trim() || '';
  const position = document.getElementById('qa-position').value;

  // 沿用該分區現有顏色（color 參數為備用）
  const existColor = editFields.find(f=>f.section===sectionName)?.sectionColor || color;

  const newField = { id:uid(), label, section:sectionName, sectionColor:existColor, type, options };

  // 找到該分區在 editFields 中的範圍
  const sectionIndices = editFields.reduce((acc,f,i)=>{ if(f.section===sectionName) acc.push(i); return acc; }, []);

  if(sectionIndices.length === 0){
    editFields.push(newField);
  } else if(position === 'start'){
    editFields.splice(sectionIndices[0], 0, newField);
  } else {
    // end：插在該分區最後一個之後
    editFields.splice(sectionIndices[sectionIndices.length-1]+1, 0, newField);
  }

  closeQAdd();
  document.getElementById('flist-wrap').innerHTML = renderFieldsBySection();
  initDragDrop();
  document.getElementById('fc-badge').textContent = editFields.length+' 個欄位';
  toast(`欄位「${label}」已加入「${sectionName}」`);
}

// ── 分區重新命名 ───────────────────────────────────────────────────────────
function startRenameSection(el){
  const oldName = el.dataset.sec;
  const color = editFields.find(f=>f.section===oldName)?.sectionColor||'#3E7265';
  const input = document.createElement('input');
  input.value = oldName;
  input.style.cssText=`font-size:12px;font-weight:700;color:${color};background:transparent;border:none;border-bottom:2px solid ${color};outline:none;width:120px;letter-spacing:1px;text-transform:uppercase;font-family:inherit;padding:0;`;
  el.replaceWith(input);
  input.focus(); input.select();
  const commit=()=>{
    const newName=input.value.trim()||oldName;
    editFields.forEach(f=>{if(f.section===oldName) f.section=newName;});
    // 同步備註 key
    if(newName!==oldName && editSectionNotes[oldName]!==undefined){
      editSectionNotes[newName]=editSectionNotes[oldName];
      delete editSectionNotes[oldName];
    }
    if(newName!==oldName && editSectionDerives[oldName]!==undefined){
      editSectionDerives[newName]=editSectionDerives[oldName];
      delete editSectionDerives[oldName];
    }
    document.getElementById('flist-wrap').innerHTML=renderFieldsBySection();
    initDragDrop();
    if(newName!==oldName) toast(`分區已重新命名為「${newName}」`);
  };
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=oldName;input.blur();}});
}

  const matches=val?all.filter(s=>s.toLowerCase().includes(val)):all;
  const box=document.getElementById('section-suggestions');
  if(!matches.length){box.style.display='none';return;}
  box.innerHTML=matches.map(s=>`
    <div onclick="pickSection('${escH(s)}')" style="padding:10px 14px;font-size:14px;cursor:pointer;color:var(--ink);transition:background .12s"
      onmouseenter="this.style.background='var(--sage-light)'" onmouseleave="this.style.background=''">
      ${escH(s)}

  box.style.display='';
}

  document.getElementById('nf-section').value=name;

let dragSrcId=null, dragOverId=null;
function onDragStart(e,el){
  dragSrcId=el.dataset.fid;
  el.style.opacity='.45';
  e.dataTransfer.effectAllowed='move';
}
function onDragOver(e,el){
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.fi').forEach(f=>f.style.boxShadow='');
  dragOverId=el.dataset.fid;
  if(dragOverId!==dragSrcId) el.style.boxShadow='0 -3px 0 var(--sage)';
}
function onDrop(e,el){
  e.preventDefault();
  const toId=el.dataset.fid;
  if(!dragSrcId||dragSrcId===toId) return;
  const fromIdx=editFields.findIndex(f=>f.id===dragSrcId);
  const toIdx=editFields.findIndex(f=>f.id===toId);
  if(fromIdx<0||toIdx<0) return;
  const [moved]=editFields.splice(fromIdx,1);
  // 讓拖曳的欄位繼承目標分區的分區名稱和顏色
  const targetField=editFields[toIdx];
  moved.section=targetField.section;
  moved.sectionColor=targetField.sectionColor;
  editFields.splice(toIdx,0,moved);
  document.getElementById('flist-wrap').innerHTML=renderFieldsBySection();
  initDragDrop();
}
function onDragEnd(e){
  document.querySelectorAll('.fi').forEach(f=>{
    f.style.opacity='';f.style.boxShadow='';
    f.setAttribute('draggable','false');
  });
  dragSrcId=null; dragOverId=null;
}
function initDragDrop(){
  // re-bind already handled by inline handlers; nothing extra needed
}

function selType(el){document.querySelectorAll('.tchip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');document.getElementById('opt-wrap').style.display=['select','multiselect'].includes(el.dataset.t)?'':'none';}

// ── 總覽表儲存格直接編輯 ──────────────────────────────────────────────────
function startCellEdit(td){
  if(td.classList.contains('editing')) return;
  const cid=td.dataset.cid, fid=td.dataset.fid;
  const type=td.dataset.type||'text';
  const opts=(td.dataset.opts||'').split(',').filter(Boolean);
  const curVal=td.textContent.trim();

  td.classList.add('editing');
  td.style.background='#fff';
  td.style.padding='0';
  td.style.boxShadow='0 0 0 2px var(--sage)';
  td.onclick=null;

  let el;
  if(type==='select'){
    el=document.createElement('select');
    el.style.cssText='width:100%;padding:8px 10px;border:none;outline:none;font-size:14px;font-family:inherit;background:#fff;cursor:pointer';
    el.innerHTML=`<option value="">—</option>${opts.map(o=>`<option ${o===curVal?'selected':''}>${escH(o)}</option>`).join('')}`;
  } else if(type==='multiselect'){
    // 渲染 checkbox 列表
    const curSet=new Set(curVal.split('|').filter(Boolean));
    const wrap=document.createElement('div');
    wrap.style.cssText='padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;min-width:160px';
    opts.forEach(o=>{
      const lbl=document.createElement('label');
      lbl.style.cssText='display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;border:1.5px solid;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:all .12s';
      const checked=curSet.has(o);
      lbl.style.borderColor=checked?'var(--sage)':'var(--border)';
      lbl.style.background=checked?'var(--sage-light)':'var(--card)';
      lbl.style.color=checked?'var(--sage)':'var(--ink2)';
      const cb=document.createElement('input');
      cb.type='checkbox'; cb.value=o; cb.checked=checked;
      cb.style.cssText='width:14px;height:14px;accent-color:var(--sage);cursor:pointer';
      cb.addEventListener('change',()=>{
        lbl.style.borderColor=cb.checked?'var(--sage)':'var(--border)';
        lbl.style.background=cb.checked?'var(--sage-light)':'var(--card)';
        lbl.style.color=cb.checked?'var(--sage)':'var(--ink2)';
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(o));
      wrap.appendChild(lbl);
    });
    // 用自訂 commit 邏輯
    td.textContent='';
    td.appendChild(wrap);
    // 點外面觸發 commit
    const multiCommit=async(e)=>{
      if(td.contains(e.target)) return;
      document.removeEventListener('click',multiCommit,true);
      const newVal=[...wrap.querySelectorAll('input:checked')].map(cb=>cb.value).join('|');
      td.classList.remove('editing');
      td.style.boxShadow='';td.style.padding='';
      td.textContent=newVal.replace(/\|/g,'、');
      td.style.background='';
      // hover 已由 CSS 處理，不需 inline handler
      td.onclick=()=>startCellEdit(td);
      if(newVal===curVal.replace(/\|/g,'、')||newVal===curVal) return;
      const c=await dbGet('cases',cid);
      if(!c) return;
      c.data[fid]=newVal; c.updatedAt=Date.now();
      await dbPut('cases',c);
      // 同步更新 vscrollState 記憶體中的資料
      if(vscrollState){
        const i=vscrollState.cases.findIndex(x=>x.id===cid);
        if(i>=0) vscrollState.cases[i].data[fid]=newVal;
      }
      toast('✅ 已更新');
    };
    setTimeout(()=>document.addEventListener('click',multiCommit,true),100);
    return;
  } else if(type==='textarea'){
    el=document.createElement('textarea');
    el.style.cssText='width:100%;min-height:72px;padding:8px 10px;border:none;outline:none;font-size:14px;font-family:inherit;resize:vertical;background:#fff';
    el.value=curVal;
  } else {
    el=document.createElement('input');
    el.type=type==='number'?'number':type==='date'?'date':type==='time'?'time':'text';
    el.style.cssText='width:100%;padding:8px 10px;border:none;outline:none;font-size:14px;font-family:inherit;background:#fff';
    el.value=curVal;
  }

  td.textContent='';
  td.appendChild(el);
  el.focus();
  if(el.select && type!=='select') el.select();

  const commit=async()=>{
    const newVal=el.value;
    td.classList.remove('editing');
    td.style.boxShadow='';
    td.style.padding='';
    td.textContent=newVal;
    td.style.background='';
    td.onclick=()=>startCellEdit(td);
    if(newVal===curVal) return;
    const c=await dbGet('cases',cid);
    if(!c) return;
    c.data[fid]=newVal;
    c.updatedAt=Date.now();
    await dbPut('cases',c);
    // 同步更新 vscrollState 記憶體中的資料
    if(vscrollState){
      const i=vscrollState.cases.findIndex(x=>x.id===cid);
      if(i>=0) vscrollState.cases[i].data[fid]=newVal;
    }
    toast('✅ 已更新');
  };

  el.addEventListener('blur', commit);
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter' && type!=='textarea'){ e.preventDefault(); el.blur(); }
    if(e.key==='Escape'){ el.value=curVal; el.blur(); }
  });
}

// ── CSV 匯回更新 ──────────────────────────────────────────────────────────
async function importCSV(input, pid){
  const file=input.files[0];
  if(!file){ input.value=''; return; }
  const p=await dbGet('projects',pid);
  const fields=p.fields||DEFAULT_FIELDS;
  const cases=await dbIdx('cases','pid',pid);

  try{
    const text=await file.text();
    // 解析 CSV（支援帶引號的值）
    const parseRow=row=>{
      const result=[]; let cur='', inQ=false;
      for(let i=0;i<row.length;i++){
        const ch=row[i];
        if(ch==='"'){ if(inQ&&row[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
        else if(ch===','&&!inQ){ result.push(cur.trim()); cur=''; }
        else cur+=ch;
      }
      result.push(cur.trim());
      return result;
    };

    // 去除 BOM
    const clean=text.replace(/^\uFEFF/,'');
    const lines=clean.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){ toast('❌ CSV 格式錯誤或無資料'); input.value=''; return; }

    const headers=parseRow(lines[0]);
    const caseNumIdx=headers.indexOf('病例號');
    if(caseNumIdx<0){ toast('❌ 找不到「病例號」欄位，請確認是由本系統匯出的 CSV'); input.value=''; return; }

    // 建立欄位 label → field 的對應表
    const labelToField={};
    fields.forEach(f=>{ labelToField[f.label]=f; });

    let updated=0, skipped=0;
    for(let i=1;i<lines.length;i++){
      const row=parseRow(lines[i]);
      if(row.length<2) continue;
      const caseNum=row[caseNumIdx].replace(/"/g,'').trim();
      const targetCase=cases.find(c=>c.caseNum===caseNum);
      if(!targetCase){ skipped++; continue; }

      // 找每個欄位並更新
      let changed=false;
      for(let j=0;j<headers.length;j++){
        const label=headers[j].replace(/"/g,'').trim();
        const field=labelToField[label];
        if(!field||j>=row.length) continue;
        const newVal=row[j].replace(/"/g,'').trim();
        if(targetCase.data[field.id]!==newVal){
          targetCase.data[field.id]=newVal;
          changed=true;
        }
      }
      if(changed){
        targetCase.updatedAt=Date.now();
        await dbPut('cases',targetCase);
        updated++;
      }
    }

    input.value='';

    // 顯示結果 & 重新載入
    if(updated>0){
      toast(`✅ 已更新 ${updated} 筆病例${skipped?`（${skipped} 筆病例號未找到，已略過）`:''}`);
      // 重新渲染總覽表
      const newCases=await dbIdx('cases','pid',pid);
      const orderedFields=getOrderedFields(p.fields||DEFAULT_FIELDS);
      rerenderSummaryTable(newCases,orderedFields,p);
    } else {
      toast(`ℹ️ 無資料變更${skipped?`（${skipped} 筆病例號未找到）`:''}`);
      input.value='';
    }

  } catch(e){
    toast('❌ CSV 解析失敗：'+e.message);
    input.value='';
  }
}

function closePasteModal(){
  document.getElementById('paste-modal')?.remove();
  pasteColFid=null; pastePid=null;
}

function updatePasteModalHint(){
  const raw=document.getElementById('pm-input')?.value||'';
  const rows=raw.split(/\r?\n/).map(r=>r.replace(/\t.*$/,'').trim()).filter(r=>r!=='');
  const start=parseInt(document.getElementById('pm-start-row')?.value||'1')||1;
  const hint=document.getElementById('pm-hint');
  if(!hint) return;
  if(rows.length>0){
    hint.textContent=`共 ${rows.length} 行 → 第 ${start} 至 ${start+rows.length-1} 筆`;
  } else {
    hint.textContent='';
  }
}

async function executePasteModal(){
  if(!pasteColFid||!pastePid){closePasteModal();return;}
  const raw=document.getElementById('pm-input')?.value||'';
  const rows=raw.split(/\r?\n/).map(r=>r.replace(/\t.*$/,'').trim()).filter(r=>r!=='');
  if(!rows.length){toast('請先貼上資料');return;}

  const startRow=Math.max(1,parseInt(document.getElementById('pm-start-row')?.value||'1')||1);
  const startIdx=startRow-1;

  const p=await dbGet('projects',pastePid);
  const existCases=await dbIdx('cases','pid',pastePid);

  let updated=0, created=0;
  for(let i=0;i<rows.length;i++){
    const val=rows[i];
    const targetIdx=startIdx+i;
    if(targetIdx<existCases.length){
      const c=existCases[targetIdx];
      c.data[pasteColFid]=val;
      c.updatedAt=Date.now();
      await dbPut('cases',c);
      updated++;
    } else {
      const newC={
        id:uid(), projectId:pastePid,
        caseNum:String(existCases.length+created+1).padStart(3,'0'),
        data:{[pasteColFid]:val},
        createdAt:Date.now()
      };
      // 不預載 __photoNote，新病例預設為連動模式
      await dbPut('cases',newC);
      created++;
    }
  }

  closePasteModal();
  toast(`✅ 從第 ${startRow} 筆起，已更新 ${updated} 筆${created?`、新增 ${created} 筆`:''}`);
  const newCases=await dbIdx('cases','pid',pastePid);
  const orderedFields=getOrderedFields(p.fields||DEFAULT_FIELDS);
  rerenderSummaryTable(newCases,orderedFields,p);
}

async function doExportJSON(){
  const checked=[...document.querySelectorAll('#export-proj-list .exp-proj-cb:checked')].map(el=>el.value);
  if(!checked.length){alert('請至少勾選一個 Project');return;}
  const allTopics=await dbAll('topics');
  const usedTopicIds=new Set();
  const payload={version:2,exportedAt:new Date().toISOString(),topics:[],projects:[]};
  for(const pid of checked){
    const p=await dbGet('projects',pid);
    const cases=await dbIdx('cases','pid',pid);
    payload.projects.push({...p,cases});
    if(p.topicId) usedTopicIds.add(p.topicId);
  }
  payload.topics=allTopics.filter(t=>usedTopicIds.has(t.id));
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const date=new Date().toLocaleDateString('zh-TW').replace(/\//g,'-');
  a.download=`病例資料_${date}.json`;
  a.click();
  toast('✅ JSON 已下載，請傳給協助者');
}

async function doImportJSON(input){
  const file=input.files[0];
  if(!file) return;
  const resultEl=document.getElementById('import-result');
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    if(!payload.version||!payload.projects) throw new Error('格式錯誤');

    let newCases=0, updCases=0, newProjs=0, newTopics=0;
    // 先匯入 topics（v2+）
    for(const t of (payload.topics||[])){
      const exT=await dbGet('topics',t.id);
      if(!exT){await dbPut('topics',t);newTopics++;}
    }
    for(const projData of payload.projects){
      const {cases,...proj}=projData;
      // 建立或更新 project
      const existing=await dbGet('projects',proj.id);
      if(!existing){await dbPut('projects',proj);newProjs++;}
      // 合併病例：以 id 為準，若已存在則比較 updatedAt 取較新者
      for(const c of (cases||[])){
        const exCase=await dbGet('cases',c.id);
        if(!exCase){
          await dbPut('cases',c);newCases++;
        } else {
          const existTs=exCase.updatedAt||exCase.createdAt||0;
          const incomTs=c.updatedAt||c.createdAt||0;
          if(incomTs>existTs){await dbPut('cases',c);updCases++;}
        }
      }
    }
    resultEl.innerHTML=`<div style="color:var(--sage);font-weight:700;padding:10px 12px;background:#EEF7F4;border-radius:8px;font-size:13px">
      ✅ 匯入完成！新增 ${newCases} 筆、更新 ${updCases} 筆病例${newProjs?`、新增 ${newProjs} 個 Project`:''}${newTopics?`、新增 ${newTopics} 個主題`:''}
    </div>`;
    // 重新整理
    setTimeout(()=>{closeSyncMod();render();},1500);
  } catch(e){
    resultEl.innerHTML=`<div style="color:var(--red);font-weight:700;padding:10px 12px;background:var(--red-bg);border-radius:8px;font-size:13px">❌ 檔案格式錯誤，請確認是正確的 JSON 檔案</div>`;
  }
}

async function quickBackup(){
  const projs = await dbAll('projects');
  if(!projs.length){ dismissReminder(); return; }
  const payload={version:1,exportedAt:new Date().toISOString(),projects:[]};
  for(const p of projs){
    const cases=await dbIdx('cases','pid',p.id);
    payload.projects.push({...p,cases});
  }
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const dt=new Date();
  const ts=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}_${String(dt.getHours()).padStart(2,'0')}${String(dt.getMinutes()).padStart(2,'0')}`;
  a.download=`病例備份_${ts}.json`;
  a.click();
  dismissReminder();
  toast('✅ 備份完成！檔案已下載');
}

// 每分鐘檢查是否需要提醒
function startBackupTimer(){
  setInterval(()=>{
    const now = Date.now();
    const last = getLastBackup();
    // 超過15分鐘且有資料
    if(now - last > BACKUP_INTERVAL){
      dbAll('projects').then(ps=>{
        if(ps.length > 0) showBackupReminder();
      });
    }
  }, 60 * 1000); // 每分鐘檢查一次

  // 初始化：第一次設定時間戳（讓15分鐘後才開始提醒）
  if(!localStorage.getItem(BACKUP_KEY)) markBackupSeen();
}

// ── 新裝置歡迎畫面 ──────────────────────────────────────────────────────────
const FIRST_VISIT_KEY = 'patientSysInstalled';

async function checkFirstVisit(){
  const isInstalled = localStorage.getItem(FIRST_VISIT_KEY);
  if(isInstalled) return; // 已用過，不顯示

  const projs = await dbAll('projects');
  if(projs.length > 0){
    // 本機已有資料，標記為已安裝
    localStorage.setItem(FIRST_VISIT_KEY, '1');
    return;
  }

  // 新裝置且無資料 → 顯示歡迎畫面
  showWelcomeScreen();
}

function showWelcomeScreen(){
  document.body.insertAdjacentHTML('beforeend',`
    <div class="overlay" id="welcome-modal">
      <div class="modal" style="max-width:520px">

        <div style="background:var(--ink);padding:32px 30px 28px;border-radius:19px 19px 0 0;text-align:center;position:relative;overflow:hidden">
          <div style="position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(62,114,101,.35) 0%,transparent 70%)"></div>
          <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--sage),var(--sage2));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;box-shadow:0 4px 16px rgba(62,114,101,.4);position:relative;z-index:1">✚</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#fff;margin-bottom:8px;position:relative;z-index:1">歡迎使用病例管理系統</div>
          <div style="font-size:14px;color:rgba(240,235,225,.5);position:relative;z-index:1">偵測到這是新裝置，本機尚無任何資料</div>
        </div>

        <div class="modal-bd">

          <!-- 選項一：匯入備份 -->
          <div style="border:1.5px solid var(--sage);border-radius:14px;padding:20px;margin-bottom:14px;cursor:pointer;transition:all .2s;background:var(--sage-light)"
            onmouseenter="this.style.background='#D8EDE8'" onmouseleave="this.style.background='var(--sage-light)'">
            <div style="display:flex;align-items:center;gap:14px">
              <div style="width:44px;height:44px;background:var(--sage);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📂</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px">我有之前的備份 JSON</div>
                <div style="font-size:13px;color:var(--muted)">匯入後立即恢復所有 Projects、欄位和病例資料</div>
              </div>
            </div>
            <label style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:12px;border:1.5px dashed rgba(62,114,101,.4);border-radius:10px;cursor:pointer;background:rgba(255,255,255,.6);font-size:14px;font-weight:600;color:var(--sage)">
              選擇 JSON 檔案 →
              <input type="file" accept=".json" style="display:none" onchange="doWelcomeImport(this)">
            </label>
          </div>

          <!-- 選項二：全新開始 -->
          <div style="border:1.5px solid var(--border2);border-radius:14px;padding:20px;cursor:pointer;transition:all .2s"
            onclick="startFresh()"
            onmouseenter="this.style.background='var(--cream)'" onmouseleave="this.style.background=''">
            <div style="display:flex;align-items:center;gap:14px">
              <div style="width:44px;height:44px;background:var(--gold-light);border:1.5px solid #E0D0A8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">✨</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px">全新開始</div>
                <div style="font-size:13px;color:var(--muted)">建立全新的資料庫，從頭建立 Projects 和欄位</div>
              </div>
            </div>
          </div>

          <div id="welcome-import-result" style="margin-top:12px"></div>
        </div>
      </div>
    </div>`);
}

async function doWelcomeImport(input){
  const file = input.files[0];
  if(!file) return;
  const resultEl = document.getElementById('welcome-import-result');
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!payload.version || !payload.projects) throw new Error('格式錯誤');

    resultEl.innerHTML=`<div style="padding:12px 14px;background:#EEF7F4;border-radius:10px;font-size:13px;color:var(--sage);font-weight:600;text-align:center">⏳ 匯入中，請稍候...</div>`;

    let newCases=0, newProjs=0, newTopics=0;
    for(const t of (payload.topics||[])){
      await dbPut('topics',t); newTopics++;
    }
    for(const projData of payload.projects){
      const {cases,...proj} = projData;
      await dbPut('projects', proj); newProjs++;
      for(const c of (cases||[])){ await dbPut('cases', c); newCases++; }
    }

    localStorage.setItem(FIRST_VISIT_KEY, '1');
    markBackupSeen();

    resultEl.innerHTML=`<div style="padding:12px 14px;background:#EEF7F4;border-radius:10px;font-size:14px;color:var(--sage);font-weight:700;text-align:center">✅ 匯入完成！${newProjs} 個 Project、${newCases} 筆病例${newTopics?`、${newTopics} 個主題`:''}已恢復</div>`;

    setTimeout(()=>{
      document.getElementById('welcome-modal')?.remove();
      vProjects();
      toast('✅ 資料已恢復，歡迎回來！');
    }, 1400);

  } catch(e){
    resultEl.innerHTML=`<div style="padding:12px 14px;background:var(--red-bg);border-radius:10px;font-size:13px;color:var(--red);font-weight:600;text-align:center">❌ 檔案格式錯誤，請確認是正確的 JSON 備份檔</div>`;
  }
}

function startFresh(){
  localStorage.setItem(FIRST_VISIT_KEY,'1');
  markBackupSeen();
  document.getElementById('welcome-modal')?.remove();
  toast('✨ 歡迎！請先建立您的第一個 Project');
}

// 關閉視窗前提醒
window.addEventListener('beforeunload', e=>{
  if(dirty){
    e.preventDefault();
    e.returnValue='有未儲存的病例變更，確定要離開？';
  }
});

// ── Boot ───────────────────────────────────────────────────────────────────
openDB().then(async ()=>{
  await vProjects();
  startBackupTimer();
  await checkFirstVisit();
});
</script>
</body>
</html>
